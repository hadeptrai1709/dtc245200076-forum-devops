# Giới hạn đăng nhập: 5 lần/phút/IP (chống brute-force)
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_status 429;

# HTTP -> HTTPS
server {
    listen 8080;
    server_name forum.local pma.forum.local grafana.forum.local;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# ===== Diễn đàn =====
server {
    listen 8443 ssl;
    server_name forum.local;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/forum.local.crt;
    ssl_certificate_key /etc/nginx/certs/forum.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=300" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /login.php {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://app:8080;
    }

    location / {
        proxy_pass http://app:8080;
    }
}

# ===== phpMyAdmin (chỉ cho mạng nội bộ) =====
server {
    listen 8443 ssl;
    server_name pma.forum.local;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/forum.local.crt;
    ssl_certificate_key /etc/nginx/certs/forum.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=300" always;

    allow 127.0.0.0/8;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;

    location / {
        proxy_pass http://phpmyadmin:80;
    }
}
