name: forum-devops
services:
  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: forum-nginx
    restart: unless-stopped
    depends_on: [app, phpmyadmin, grafana]
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [frontend]

  mysql:
    image: mysql:8.0
    container_name: forum-mysql
    restart: unless-stopped
    env_file: .env
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  app:
    build: ./app
    image: forum-app:1.0
    container_name: forum-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_APP_USER}
      DB_PASS: ${MYSQL_APP_PASSWORD}
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [frontend, backend]

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: forum-pma
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_ABSOLUTE_URI: https://pma.forum.local/
    networks: [frontend, backend]

  # ===== Giám sát =====
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: forum-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - "127.0.0.1:9090:9090"   # chỉ mở cho chính máy này
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    security_opt:
      - no-new-privileges:true
    networks: [monitoring]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: forum-grafana
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: grafana.forum.local
      GF_SERVER_ROOT_URL: https://grafana.forum.local/
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    security_opt:
      - no-new-privileges:true
    networks: [frontend, monitoring]

  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    container_name: forum-cadvisor
    restart: unless-stopped
    command: ["--housekeeping_interval=30s", "--docker_only=true"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [monitoring]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: forum-node-exporter
    restart: unless-stopped
    command: ['--path.rootfs=/host']
    volumes:
      - /:/host:ro,rslave
    security_opt:
      - no-new-privileges:true
    networks: [monitoring]

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: forum-mysqld-exporter
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    command: ['--config.my-cnf=/etc/mysqld-exporter/.my.cnf']
    volumes:
      - ./monitoring/mysqld-exporter.cnf:/etc/mysqld-exporter/.my.cnf:ro
    security_opt:
      - no-new-privileges:true
    networks: [backend, monitoring]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: forum-nginx-exporter
    restart: unless-stopped
    depends_on: [nginx]
    command: ['--nginx.scrape-uri=http://nginx:8081/stub_status']
    security_opt:
      - no-new-privileges:true
    networks: [frontend, monitoring]

  # ===== Log tập trung =====
  loki-init:
    # chạy một lần: đổi chủ sở hữu volume sang user của Loki (uid 10001), rồi thoát
    image: busybox:1.37
    container_name: forum-loki-init
    user: "0:0"
    command: ['sh', '-c', 'chown -R 10001:10001 /loki']
    volumes:
      - loki_data:/loki
    network_mode: none
    restart: "no"

  loki:
    image: grafana/loki:3.6.0
    container_name: forum-loki
    restart: unless-stopped
    depends_on:
      loki-init:
        condition: service_completed_successfully
    command: ['-config.file=/etc/loki/loki-config.yml']
    volumes:
      - ./logging/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    security_opt:
      - no-new-privileges:true
    networks: [monitoring]

  promtail:
    image: grafana/promtail:3.6.0
    container_name: forum-promtail
    restart: unless-stopped
    depends_on: [loki]
    command: ['-config.file=/etc/promtail/promtail-config.yml']
    volumes:
      - ./logging/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/positions
    security_opt:
      - no-new-privileges:true
    networks: [monitoring]

networks:
  frontend:
  backend:
    internal: true
  monitoring:

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
